name: Release NMIX Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, example v1.0.10"
        required: true
        default: "v1.0.10"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NMIX_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > nmix-release.jks

      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ secrets.NMIX_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NMIX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NMIX_KEY_PASSWORD }}
        run: |
          {
            echo "storeFile=nmix-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed release
        run: gradle assembleRelease

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
          "NMIX-${{ inputs.version }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: NMIX ${{ inputs.version }}
          generate_release_notes: true
          files: NMIX-${{ inputs.version }}.apk
